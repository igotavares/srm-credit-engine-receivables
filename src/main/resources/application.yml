server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: receivables
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/receivables}
    username: ${DB_USER:srm}
    password: ${DB_PASSWORD:srm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  exchange-rate:
    base-url: ${EXCHANGE_RATE_BASE_URL:http://localhost:1080}

springdoc:
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
